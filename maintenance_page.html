<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        p {
            font-size: 1.2rem;
            color: #007bff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        h2 {
            font-size: 1.1rem;
            color: #666;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>This Website Is Under Maintenance</p>
        <h1>Please Contact The Administrator If You Have Any Questions</h1>
        <h2>Good To See You :)</h2>
    </div>
</body>
</html>
